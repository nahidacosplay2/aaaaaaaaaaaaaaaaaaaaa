name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  assemble-release-variant:
    name: Assemble Android release variant
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK and NDK packages
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'

      - name: Assemble APK
        working-directory: android-app
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify and checksum APK
        working-directory: android-app
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk" > "$apk.sha256"
          printf 'variant=release\napplicationId=app.zapret.aris\nsourceCommit=%s\nsigning=ephemeral CI debug key; test-only, not suitable for stable updates or Google Play\n' "$GITHUB_SHA" > app/build/outputs/apk/release/build-info.txt

      - name: Upload testable APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ZapretAris-release-${{ github.sha }}
          path: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/apk/release/app-release.apk.sha256
            android-app/app/build/outputs/apk/release/build-info.txt
          if-no-files-found: error
          retention-days: 14
